name: Closing radar tests
on:
  pull_request:
    paths:
      - 'src/marketbrief/closing/**'
      - 'tests/test_closing.py'
      - 'requirements-closing.txt'
      - 'config/closing.json'
      - '.github/workflows/closing*.yml'
      - 'scripts/restore_closing_state.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-closing.txt pytest==9.1.1
      - run: PYTHONPATH=src python -m pytest tests/test_closing.py -q
