name: One-time YouTube Telegram test

on:
  push:
    branches: [main]

jobs:
  send:
    if: contains(github.event.head_commit.message, 'Run one-time YouTube Telegram test')
    runs-on: ubuntu-latest
    steps:
      - name: Send latest verified summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          message = """📺 슈퍼개미 이세무사TV 요약 (발송 테스트)

최근 영상: 개인은 3조 샀는데 외국인·기관은 팔았다? 7,000선에 또 막힌 코스피...

• 코스피·코스닥 모두 2%대 하락
• 개인은 대규모 순매수, 외국인·기관은 동반 매도
• 강세: 화장품·게임·소비주, 라온시큐어, SAMG엔터·삼표
• 약세: SK하이닉스·삼성전기, 현대차, 주성엔지니어링·LG
• 다음 장 체크: 옵션 만기, 미국 금리·경제지표, TSMC·ASML·삼성전자·SK하이닉스 실적

원본 영상:
https://www.youtube.com/watch?v=YTU7rE9cEnQ

※ 오늘은 장 마감 이후 새 영상이 없어 최근 영상으로 발송 기능을 시험했습니다."""
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          data = json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": message, "disable_web_page_preview": True}).encode()
          req = urllib.request.Request(url, data=data, headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise SystemExit("Telegram send failed")
          print("Telegram test message sent successfully")
          PY
