name: Requested detailed video briefing
on:
  push:
    branches: [main]
jobs:
  send:
    if: contains(github.event.head_commit.message, '[detailed-video-send]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-youtube.txt pytest
      - name: Verify video pipeline
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_video.py tests/test_gemini.py
      - name: Analyze original video and send requested example
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from marketbrief.video.pipeline import Video, render, deliver_telegram, save_json
          from marketbrief.video.gemini import analyze_video
          video = Video('YTU7rE9cEnQ', '개인은 3조 샀는데 외국인·기관은 팔았다? 7,000선에 또 막힌 코스피...', '2026-10-07T09:28:15+00:00')
          summary, metadata = analyze_video(video)
          message = '📺 개선된 요약 예시 · 10월 7일 영상 재분석\n\n' + render(video, summary, date(2026, 10, 7))
          print(message)
          save_json(Path('reports/youtube/improved-analysis.json'), {'summary': summary, 'analysis': metadata})
          receipt = {}
          deliver_telegram(message, receipt, lambda r: save_json(Path('reports/youtube/example-receipt.json'), r))
          print('Requested detailed briefing delivered successfully')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requested-detailed-video-report
          path: reports/youtube/
          retention-days: 7
