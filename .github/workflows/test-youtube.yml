name: Manual YouTube Test

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install -e .
      - name: Run one-off analysis and telegram send
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python - << 'EOF'
          import inspect
          from datetime import date, datetime, timezone
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          dt = datetime(2026, 10, 7, 9, 28, 15, tzinfo=timezone.utc)
          target_video = Video(
              video_id="YTU7rE9cEnQ",
              title="[과거 분석 예시 2026-10-07] 개인은 3조 샀는데 외국인·기관은 팔았다? 7,000선에 또 막힌 코스피...",
              published_at=dt,
              channel_id="UCowHl0BGalL433P6bCBgeKA",
          )

          print("1. Gemini 원본 영상 분석 시작 (gemini-3.8-flash)...")
          summary, metadata = analyze_video(target_video)
          print(f"2. 분석 완료! 사용 모델: {metadata.get('model')}")

          print("3. 메시지 렌더링...")
          render_sig = inspect.signature(render)
          if len(render_sig.parameters) >= 3:
              message = render(target_video, summary, date(2026, 10, 7))
          else:
              message = render(target_video, summary)

          print("4. 텔레그램 발송...")
          dt_sig = inspect.signature(deliver_telegram)
          dt_params = list(dt_sig.parameters.keys())
          receipt_path = "data/youtube/test-2026-10-07.json"
          if len(dt_params) >= 3:
              deliver_telegram(message, receipt_path, False)
          elif len(dt_params) == 2:
              deliver_telegram(message, receipt_path)
          else:
              deliver_telegram(message)

          print("===> 텔레그램 발송 완료! <===")
          EOF
