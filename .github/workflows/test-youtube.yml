name: Manual YouTube Test

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install -e .
      - name: Run one-off analysis and telegram send
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import time
          from datetime import date, datetime, timezone
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          dt = datetime(2026, 10, 7, 9, 28, 15, tzinfo=timezone.utc)
          target_video = Video(
              video_id="YTU7rE9cEnQ",
              title="[과거 분석 예시 2026-10-07] 개인은 3조 샀는데 외국인·기관은 팔았다? 7,000선에 또 막힌 코스피...",
              published_at=dt,
              channel_id="UCowHl0BGalL433P6bCBgeKA",
          )

          # 503 발생 시 자동 전환할 후보 모델 목록
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              print(f"\n==========================================")
              print(f"Gemini 원본 영상 분석 시도: {model_name}")
              print(f"==========================================")
              os.environ["GEMINI_MODEL"] = model_name
              
              for attempt in range(1, 4):
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"===> 영상 분석 성공! (적용 모델: {metadata.get('model')})")
                      break
                  except Exception as e:
                      err_msg = str(e)
                      print(f"[{model_name} 시도 {attempt}/3 실패]: {err_msg}")
                      if "503" in err_msg or "서비스 응답 실패" in err_msg:
                          print("Google 일시 부하(503) 감지. 20초 대기 후 다시 시도합니다...")
                          time.sleep(20)
                      else:
                          break
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("모든 후보 모델 및 재시도에서 영상 분석에 실패했습니다.")

          print("\n1. 텔레그램 메시지 렌더링...")
          message = render(target_video, summary, date(2026, 10, 7))

          print("2. 텔레그램 발송 시작...")
          # receipt를 올바른 dict 객체로 전달하여 텔레그램 발송 완료
          try:
              deliver_telegram(message, receipt={}, save=False)
          except TypeError:
              deliver_telegram(message, {}, False)

          print("\n🎉 [성공] 텔레그램 발송이 성공적으로 완료되었습니다!")
          EOF
