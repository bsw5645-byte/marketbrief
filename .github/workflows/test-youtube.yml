name: Manual YouTube Test

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install -e .
      - name: Run one-off analysis and telegram send
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: |
          python - << 'EOF'
          import inspect
          from datetime import date, datetime, timezone
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          print("--- Video 객체 생성 ---")
          sig = inspect.signature(Video)
          print("Video 매개변수 목록:", list(sig.parameters.keys()))

          dt = datetime(2026, 10, 7, 9, 28, 15, tzinfo=timezone.utc)
          candidates = {
              "video_id": "YTU7rE9cEnQ",
              "title": "[과거 분석 예시 2026-10-07] 개인은 3조 샀는데 외국인·기관은 팔았다? 7,000선에 또 막힌 코스피...",
              "published_at": dt,
              "published": dt,
              "channel_id": "UCowHl0BGalL433P6bCBgeKA",
          }

          kwargs = {k: v for k, v in candidates.items() if k in sig.parameters}
          try:
              target_video = Video(**kwargs)
          except TypeError:
              if "published_at" in kwargs:
                  kwargs["published_at"] = "2026-10-07T09:28:15+00:00"
              if "published" in kwargs:
                  kwargs["published"] = "2026-10-07T09:28:15+00:00"
              target_video = Video(**kwargs)

          if not hasattr(target_video, "url") or not target_video.url:
              try:
                  object.__setattr__(target_video, "url", "https://www.youtube.com/watch?v=YTU7rE9cEnQ")
              except Exception:
                  pass

          print("생성된 Target Video:", target_video)

          print("\n1. Gemini 원본 영상 분석 시작 (503 재시도 및 모델 전환 적용)...")
          summary, metadata = analyze_video(target_video)
          print(f"2. 분석 완료! 사용 모델: {metadata.get('model')}")

          print("\n3. 메시지 렌더링...")
          render_sig = inspect.signature(render)
          if len(render_sig.parameters) >= 3:
              message = render(target_video, summary, date(2026, 10, 7))
          else:
              message = render(target_video, summary)

          print("\n4. 텔레그램 발송...")
          dt_sig = inspect.signature(deliver_telegram)
          dt_params = list(dt_sig.parameters.keys())
          receipt_path = "data/youtube/test-2026-10-07.json"
          if len(dt_params) >= 3:
              deliver_telegram(message, receipt_path, False)
          elif len(dt_params) == 2:
              deliver_telegram(message, receipt_path)
          else:
              deliver_telegram(message)

          print("5. 텔레그램 발송 완료!")
          EOF
