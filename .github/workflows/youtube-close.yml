name: YouTube Close

on:
  schedule:
    # 월~금 한국 시각(KST) 20:00 실행 (UTC 11:00)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  youtube-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install yt-dlp
          pip install -e .
      - name: Analyze Lee Semusa Close Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import json
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone, timedelta
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_date = now_kst.date()

          print(f"[{today_date}] 슈퍼개미 이세무사TV 당일 마감시황 자동 탐색 시작...")

          # 1. yt-dlp로 채널의 최근 업로드 영상 목록 조회 (한국어 강제)
          cmd = [
              "yt-dlp",
              "--dump-json",
              "--playlist-items", "1-5",
              "--extractor-args", "youtube:lang=ko",
              "https://www.youtube.com/@leesemusaTV/videos"
          ]

          target_entry = None
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
              for line in proc.stdout.strip().splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  title = item.get("title", "")
                  vid = item.get("id")

                  # 쇼츠 영상 제외
                  if "shorts" in item.get("url", "") or "Shorts" in title:
                      continue

                  # 업로드 일자(KST) 추출
                  timestamp = item.get("timestamp")
                  if timestamp:
                      pub_dt = datetime.fromtimestamp(timestamp, tz=timezone.utc).astimezone(KST)
                      upload_date = pub_dt.date()
                  elif item.get("upload_date"):
                      upload_date = datetime.strptime(item["upload_date"], "%Y%m%d").date()
                      pub_dt = datetime(upload_date.year, upload_date.month, upload_date.day, tzinfo=KST)
                  else:
                      upload_date = None
                      pub_dt = datetime.now(timezone.utc)

                  # 당일(오늘) 날짜 일치 확인
                  is_today = (upload_date == today_date) or (now_kst.strftime("%m.%d") in title) or (f"{now_kst.month}월 {now_kst.day}일" in title)

                  # 마감시황 키워드 판별 (제목에 '마감'이 없어도 코스피/코스닥/수급 등 시황 영상 포착)
                  is_market_close = any(kw in title for kw in ["마감시황", "마감", "장마감", "코스피", "코스닥", "수급", "외국인", "200일선", "박스권", "시장 흐름", "지수"])

                  print(f"후보 영상: [{title}] | 업로드일: {upload_date} | 당일여부: {is_today}")

                  if is_today and is_market_close:
                      target_entry = {
                          "video_id": vid,
                          "title": title,
                          "published_at": pub_dt,
                      }
                      break
          except Exception as e:
              print(f"영상 탐색 중 오류: {e}")

          # 당일 마감 영상이 아직 업로드되지 않은 경우 (휴장일 또는 이른 시각 실행)
          if not target_entry:
              print(f"\n[안내] 오늘({today_date})자 이세무사 마감시황 영상이 아직 업로드되지 않았습니다. 작업을 안전하게 종료합니다.")
              sys.exit(0)

          print(f"\n타깃 영상 확정 (당일 마감시황): {target_entry['title']}")
          print(f"YouTube ID: {target_entry['video_id']}")
          print(f"게시 일시: {target_entry['published_at']}")

          target_video = Video(
              video_id=target_entry["video_id"],
              title=target_entry["title"],
              published_at=target_entry["published_at"],
              channel_id="UCowHl0BGalL433P6bCBgeKA",
          )

          # 2. Gemini 본영상 상세 요약 분석 (3.8-flash -> 3.7-flash 자동 전환)
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              print(f"\nGemini 마감시황 영상 분석 시도: {model_name}...")
              os.environ["GEMINI_MODEL"] = model_name
              for attempt in range(1, 4):
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"===> 분석 성공! (적용 모델: {metadata.get('model')})")
                      break
                  except Exception as exc:
                      print(f"[{model_name} 시도 {attempt}/3 실패]: {exc}")
                      time.sleep(20)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("Gemini 영상 분석에 실패했습니다.")

          # 3. 렌더링 및 텔레그램 발송 (당일 날짜로 정확히 동적 반영)
          print("\n1. 텔레그램 메시지 렌더링...")
          message = render(target_video, summary, today_date)

          print("2. 텔레그램 발송 시작...")
          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print(f"\n🎉 오늘({today_date})자 이세무사TV 마감시황 텔레그램 발송 완료!")
          EOF
