name: YouTube Close

on:
  schedule:
    # 월~금 한국 시각(KST) 20:00 실행 (UTC 11:00)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  youtube-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install yt-dlp
          pip install -e .
      - name: Analyze Lee Semusa Close Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import base64
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_date = now_kst.date()
          gemini_key = os.environ.get("GEMINI_API_KEY")

          print(f"[{today_date}] 슈퍼개미 이세무사TV 마감시황 정밀 탐색 시작...")

          # 1. 채널의 최근 6개 영상 ID 수집
          cmd = [
              "yt-dlp",
              "--flat-playlist",
              "--dump-json",
              "--playlist-items", "1-6",
              "https://www.youtube.com/@leesemusaTV/videos"
          ]

          proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
          cand_ids = []
          for line in proc.stdout.strip().splitlines():
              if not line.strip():
                  continue
              item = json.loads(line)
              vid = item.get("id")
              if vid and vid not in cand_ids:
                  cand_ids.append(vid)

          # 썸네일 [마감시황] 뱃지 판독 함수
          def check_thumbnail_badge(vid):
              thumb_url = f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
              try:
                  req = urllib.request.Request(thumb_url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      img_b64 = base64.b64encode(resp.read()).decode("utf-8")

                  for m_name in ["gemini-3.8-flash", "gemini-3.7-flash"]:
                      api_url = f"https://generativelanguage.googleapis.com/v1beta/models/{m_name}:generateContent?key={gemini_key}"
                      payload = json.dumps({
                          "contents": [{
                              "parts": [
                                  {"inlineData": {"mimeType": "image/jpeg", "data": img_b64}},
                                  {"text": "이 유튜브 썸네일 이미지의 왼쪽 상단에 빨간색 사각형 배경으로 '마감시황'이라는 글자가 적혀 있습니까? 적혀 있으면 'YES', 없으면 'NO'라고만 답하세요."}
                              ]
                          }],
                          "generationConfig": {"temperature": 0.0, "maxOutputTokens": 10}
                      }).encode("utf-8")

                      try:
                          req_api = urllib.request.Request(api_url, data=payload, headers={"Content-Type": "application/json"})
                          with urllib.request.urlopen(req_api, timeout=15) as a_resp:
                              data = json.loads(a_resp.read().decode("utf-8"))
                              txt = data.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "").strip()
                              if "YES" in txt.upper():
                                  return True
                              elif "NO" in txt.upper():
                                  return False
                      except Exception:
                          pass
              except Exception as e:
                  print(f"[{vid}] 썸네일 판독 오류: {e}")
              return None

          target_entry = None

          # 2. 영상별 개별 상세 정보(업로드일, 제목, 썸네일 뱃지) 정밀 검사
          for vid in cand_ids:
              v_cmd = ["yt-dlp", "--dump-json", "--no-playlist", f"https://www.youtube.com/watch?v={vid}"]
              try:
                  v_proc = subprocess.run(v_cmd, capture_output=True, text=True, check=True)
                  v_info = json.loads(v_proc.stdout)
              except Exception as e:
                  continue

              title = v_info.get("title", "")
              upload_date_str = v_info.get("upload_date")
              timestamp = v_info.get("timestamp")

              if timestamp:
                  pub_dt = datetime.fromtimestamp(timestamp, tz=timezone.utc).astimezone(KST)
                  up_date = pub_dt.date()
              elif upload_date_str:
                  up_date = datetime.strptime(upload_date_str, "%Y%m%d").date()
                  pub_dt = datetime(up_date.year, up_date.month, up_date.day, tzinfo=KST)
              else:
                  up_date = None
                  pub_dt = datetime.now(timezone.utc)

              print(f"\n[후보 검토] {title} (ID: {vid})")
              print(f" -> 실제 업로드일: {up_date} (오늘 여부: {up_date == today_date})")

              if up_date != today_date:
                  print(" -> 오늘자 영상이 아니므로 건너뜁니다.")
                  continue

              if "재테크브라더스" in title or "Shorts" in title or "shorts" in title:
                  print(" -> 마감시황 외 기획 영상이므로 건너뜁니다.")
                  continue

              # 썸네일 [마감시황] 뱃지 판독
              is_badge = check_thumbnail_badge(vid)
              print(f" -> 썸네일 '마감시황' 뱃지 판독: {is_badge}")

              # 뱃지 확인 성공 시 확정, 판독 일시 오류 시 보조 규칙 적용
              if is_badge is True:
                  target_entry = {"video_id": vid, "title": title, "published_at": pub_dt}
                  print(f"===> 썸네일 [마감시황] 뱃지 일치! 최종 타깃 확정!")
                  break
              elif is_badge is None:
                  duration = v_info.get("duration", 0)
                  if any(kw in title for kw in ["코스피", "코스닥", "마감", "외국인", "수급", "박스권"]) and (400 <= duration <= 1800):
                      target_entry = {"video_id": vid, "title": title, "published_at": pub_dt}
                      print(f"===> 보조 시황 규칙 일치로 확정!")
                      break

          if not target_entry:
              print(f"\n[안내] 오늘({today_date})자 이세무사 마감시황 영상을 찾지 못했습니다. 작업을 안전하게 종료합니다.")
              sys.exit(0)

          print(f"\n타깃 영상 최종 확정: {target_entry['title']}")
          print(f"YouTube ID: {target_entry['video_id']}")

          target_video = Video(
              video_id=target_entry["video_id"],
              title=target_entry["title"],
              published_at=target_entry["published_at"],
              channel_id="UCowHl0BGalL433P6bCBgeKA",
          )

          # 3. Gemini 영상 상세 분석
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              print(f"\nGemini 마감시황 분석 시도: {model_name}...")
              os.environ["GEMINI_MODEL"] = model_name
              for attempt in range(1, 4):
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"===> 분석 성공! (적용 모델: {metadata.get('model')})")
                      break
                  except Exception as exc:
                      print(f"[{model_name} 시도 {attempt}/3 실패]: {exc}")
                      time.sleep(20)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("Gemini 영상 분석에 실패했습니다.")

          # 4. 렌더링 및 텔레그램 발송
          print("\n1. 텔레그램 메시지 렌더링...")
          message = render(target_video, summary, today_date)

          print("2. 텔레그램 발송 시작...")
          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print(f"\n🎉 오늘({today_date})자 이세무사TV 마감시황 텔레그램 발송 완료!")
          EOF
