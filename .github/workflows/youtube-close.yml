name: YouTube Close

on:
  schedule:
    # 월~금 한국 시각(KST) 20:00 실행 (UTC 11:00)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  youtube-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install yt-dlp
          pip install -e .
      - name: Analyze Lee Semusa Close Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import base64
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_date = now_kst.date()
          gemini_key = os.environ.get("GEMINI_API_KEY")

          print(f"[{today_date}] 슈퍼개미 이세무사TV 마감시황 썸네일 검증 탐색 시작...")

          # 1. 최근 영상 5개 가져오기
          cmd = [
              "yt-dlp",
              "--flat-playlist",
              "--dump-json",
              "--playlist-items", "1-5",
              "https://www.youtube.com/@leesemusaTV/videos"
          ]

          target_entry = None
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
              candidates = []
              for line in proc.stdout.strip().splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  candidates.append({"video_id": item.get("id"), "title": item.get("title", "")})

              # 2. 각 영상의 썸네일을 Gemini 시각 모델로 검증
              for cand in candidates:
                  vid = cand["video_id"]
                  title = cand["title"]
                  thumb_url = f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"

                  try:
                      # 썸네일 다운로드
                      req_img = urllib.request.Request(thumb_url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req_img, timeout=10) as resp:
                          img_bytes = resp.read()
                      b64_img = base64.b64encode(img_bytes).decode("utf-8")

                      # Gemini에게 썸네일 이미지 직접 판독 요청
                      verify_api = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key={gemini_key}"
                      verify_payload = json.dumps({
                          "contents": [{
                              "parts": [
                                  {"inlineData": {"mimeType": "image/jpeg", "data": b64_img}},
                                  {"text": "이 유튜브 썸네일 이미지의 왼쪽 상단(또는 화면 어딘가)에 '마감시황'이라는 글자가 적혀 있습니까? 적혀 있으면 오직 'YES', 적혀 있지 않으면 'NO'라고만 답하세요."}
                              ]
                          }],
                          "generationConfig": {"temperature": 0.0, "maxOutputTokens": 10}
                      }).encode("utf-8")

                      req_verify = urllib.request.Request(verify_api, data=verify_payload, headers={"Content-Type": "application/json"})
                      with urllib.request.urlopen(req_verify, timeout=15) as v_resp:
                          v_data = json.loads(v_resp.read().decode("utf-8"))
                          answer = v_data["candidates"][0]["content"]["parts"][0]["text"].strip()

                      print(f"후보 영상: [{title}] -> 썸네일 '마감시황' 인식 결과: {answer}")

                      if "YES" in answer.upper():
                          target_entry = cand
                          print(f"===> [마감시황] 썸네일 뱃지 확인 성공! 확정: {title}")
                          break
                  except Exception as e:
                      print(f"[{title}] 썸네일 판독 중 오류({e}) -> 제목 텍스트로 보조 검토")
                      if any(kw in title for kw in ["마감시황", "장마감", "코스피", "200일선"]):
                          target_entry = cand
                          break

          except Exception as e:
              print(f"영상 탐색 중 전체 오류: {e}")

          if not target_entry:
              print(f"오늘({today_date})자 이세무사 마감시황 영상을 찾지 못했습니다. 작업을 종료합니다.")
              sys.exit(0)

          target_video = Video(
              video_id=target_entry["video_id"],
              title=target_entry["title"],
              published_at=datetime.now(timezone.utc),
              channel_id="UCowHl0BGalL433P6bCBgeKA",
          )

          # 3. Gemini 본영상 상세 요약 분석
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              print(f"\nGemini 본영상 분석 시도: {model_name}...")
              os.environ["GEMINI_MODEL"] = model_name
              for attempt in range(1, 4):
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"===> 분석 성공! (적용 모델: {metadata.get('model')})")
                      break
                  except Exception as exc:
                      print(f"[{model_name} 시도 {attempt}/3 실패]: {exc}")
                      time.sleep(20)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("Gemini 영상 분석에 실패했습니다.")

          # 4. 렌더링 및 텔레그램 발송
          print("\n1. 텔레그램 메시지 렌더링...")
          message = render(target_video, summary, today_date)

          print("2. 텔레그램 발송 시작...")
          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print("\n🎉 이세무사TV 마감시황 텔레그램 발송 완료!")
          EOF
