name: YouTube Close

on:
  schedule:
    # 월~금 한국 시각(KST) 20:00 실행 (UTC 11:00)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: youtube-close
  cancel-in-progress: true

jobs:
  youtube-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install Pillow
          pip install -e .
      - name: Analyze Lee Semusa Close Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import io
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from PIL import Image
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)

          print(f"[{now_kst.strftime('%Y-%m-%d %H:%M:%S')}] 슈퍼개미 이세무사TV 마감시황 탐색 시작...")

          # 1. 유튜브 공식 RSS 피드 조회
          feed_url = "https://www.youtube.com/feeds/videos.xml?channel_id=UCowHl0BGalL433P6bCBgeKA"
          candidates = []
          try:
              req = urllib.request.Request(feed_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  xml_data = resp.read()
              root = ET.fromstring(xml_data)
              ns = {"atom": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
              for entry in root.findall("atom:entry", ns):
                  vid = entry.find("yt:videoId", ns).text
                  title = entry.find("atom:title", ns).text
                  pub_str = entry.find("atom:published", ns).text
                  pub_dt = datetime.fromisoformat(pub_str.replace("Z", "+00:00")).astimezone(KST)
                  candidates.append({"video_id": vid, "title": title, "published_at": pub_dt})
          except Exception as e:
              print(f"RSS 피드 오류: {e}")

          # 쇼츠(Shorts) 여부 판별 함수 (리다이렉트 없으면 쇼츠)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def is_shorts_video(vid):
              url = f"https://www.youtube.com/shorts/{vid}"
              opener = urllib.request.build_opener(NoRedirect)
              req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with opener.open(req, timeout=10) as resp:
                      return resp.status == 200
              except urllib.error.HTTPError as e:
                  return False
              except Exception:
                  return False

          # 썸네일 좌측 상단 빨간색 [마감시황] 뱃지 감지 함수 (API 호출 없이 즉시 판별)
          def has_red_close_badge(vid):
              thumb_url = f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg"
              try:
                  req = urllib.request.Request(thumb_url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      img_data = resp.read()
                  img = Image.open(io.BytesIO(img_data)).convert("RGB")
                  # hqdefault(480x360) 기준 좌측 상단 16:9 영역(x:12~90, y:45~125) 크롭
                  crop = img.crop((12, 45, 90, 125))
                  pixels = list(crop.getdata())
                  red_pixels = sum(1 for r, g, b in pixels if r > 140 and g < 60 and b < 60 and (r - g) > 90)
                  ratio = red_pixels / len(pixels)
                  return ratio >= 0.22, ratio
              except Exception as e:
                  print(f"썸네일 픽셀 검사 오류: {e}")
                  return False, 0.0

          target_entry = None
          for item in candidates:
              vid = item["video_id"]
              title = item["title"]
              pub_dt = item["published_at"]
              hours_ago = (now_kst - pub_dt).total_seconds() / 3600

              # 최근 36시간 이내 영상만 검사
              if hours_ago > 36:
                  continue

              print(f"\n[후보 검사] {title} (ID: {vid}, {hours_ago:.1f}시간 전)")

              # 기획/라이브/쇼츠 제목 제외
              if any(ex in title for ex in ["재테크브라더스", "Shorts", "shorts", "퇴근길", "특강", "인터뷰", "LIVE", "라이브", "몽당연필", "홈런왕"]):
                  print(" -> 제외 키워드 포함으로 패스")
                  continue

              # 쇼츠 URL 검사로 쇼츠 완벽 차단
              if is_shorts_video(vid):
                  print(" -> 유튜브 쇼츠(Shorts) 영상이므로 패스")
                  continue

              # 썸네일 좌측 상단 빨간색 [마감시황] 뱃지 확인
              badge_ok, red_ratio = has_red_close_badge(vid)
              print(f" -> 썸네일 좌측상단 [마감시황] 빨간 뱃지 비율: {red_ratio*100:.1f}% (기준 통과: {badge_ok})")

              if badge_ok:
                  target_entry = item
                  print("===> [마감시황] 썸네일 뱃지 확인 완료! 최종 타깃 확정!")
                  break

          if not target_entry:
              print("\n[안내] 최근 마감시황 영상을 찾지 못했습니다. 안전 종료합니다.")
              sys.exit(0)

          print(f"\n타깃 영상: {target_entry['title']}")
          print(f"YouTube ID: {target_entry['video_id']}")

          target_video = Video(
              video_id=target_entry["video_id"],
              title=target_entry["title"],
              published_at=target_entry["published_at"],
              channel_id="UCowHl0BGalL433P6bCBgeKA",
          )

          # 2. Gemini 영상 분석 (API 쿼터 온전히 보존 상태로 1회 집중 호출)
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-2.5-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              print(f"\nGemini 마감시황 분석 시도: {model_name}...")
              os.environ["GEMINI_MODEL"] = model_name
              for attempt in range(1, 3):
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"===> 분석 성공! (적용 모델: {metadata.get('model')})")
                      break
                  except Exception as exc:
                      print(f"[{model_name} 시도 {attempt}/2 실패]: {exc}")
                      time.sleep(30)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("Gemini 영상 분석 최종 실패")

          # 3. 렌더링 및 텔레그램 발송
          print("\n1. 텔레그램 메시지 렌더링...")
          message = render(target_video, summary, target_entry["published_at"].date())

          print("2. 텔레그램 발송 시작...")
          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print(f"\n🎉 이세무사TV 마감시황 텔레그램 발송 완료!")
          EOF
