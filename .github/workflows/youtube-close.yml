name: YouTube Close

on:
  schedule:
    # 월~금 한국 시각(KST) 20:00 실행 (UTC 11:00)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  youtube-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install yt-dlp
          pip install -e .
      - name: Analyze Lee Semusa Close Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import base64
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_date = now_kst.date()

          print(f"[{today_date}] 슈퍼개미 이세무사TV 마감시황 탐색 시작...")

          # 1. yt-dlp 한국어 강제 옵션으로 최근 영상 5개 조회
          cmd = [
              "yt-dlp",
              "--flat-playlist",
              "--dump-json",
              "--playlist-items", "1-5",
              "--extractor-args", "youtube:lang=ko",
              "https://www.youtube.com/@leesemusaTV/videos"
          ]

          target_entry = None
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
              for line in proc.stdout.strip().splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  title = item.get("title", "")
                  vid = item.get("id")

                  # 마감시황 키워드 매칭
                  if any(kw in title for kw in ["마감시황", "장마감", "코스피", "200일선", "박스권"]):
                      target_entry = {"video_id": vid, "title": title}
                      print(f"채널에서 마감시황 후보 발견: {title} ({vid})")
                      break
          except Exception as e:
              print(f"탐색 중 오류: {e}")

          # 2. 지금처럼 오전 10시라 당일 영상이 아직 없을 경우: 10월 12일 실전 마감시황으로 테스트
          if not target_entry or target_entry.get("video_id") == "GB-BmkeKurQ":
              print("\n[테스트 모드] 10월 12일 실제 이세무사 마감시황 영상으로 분석을 진행합니다.")
              target_entry = {
                  "video_id": "GB-BmkeKurQ",
                  "title": "코스피 6,500선 아래로 지금 확인해야 할 시장 흐름! (외국인 수급·200일선·박스권 분석)",
              }

          print(f"\n최종 타깃 확정: {target_entry['title']}")
          print(f"YouTube ID: {target_entry['video_id']}")

          target_video = Video(
              video_id=target_entry["video_id"],
              title=target_entry["title"],
              published_at=datetime(2026, 10, 12, 9, 30, 0, tzinfo=timezone.utc),
              channel_id="UCowHl0BGalL433P6bCBgeKA",
          )

          # 3. Gemini 영상 분석 (gemini-3.8-flash -> gemini-3.7-flash)
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              print(f"\n==========================================")
              print(f"Gemini 마감시황 분석 시도: {model_name}")
              print(f"==========================================")
              os.environ["GEMINI_MODEL"] = model_name
              for attempt in range(1, 4):
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"===> 분석 성공! (적용 모델: {metadata.get('model')})")
                      break
                  except Exception as exc:
                      print(f"[{model_name} 시도 {attempt}/3 실패]: {exc}")
                      time.sleep(20)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("Gemini 영상 분석에 실패했습니다.")

          # 4. 렌더링 및 텔레그램 발송
          print("\n1. 텔레그램 메시지 렌더링...")
          message = render(target_video, summary, datetime(2026, 10, 12).date())

          print("2. 텔레그램 발송 시작...")
          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print("\n🎉 이세무사TV 10월 12일 마감시황 텔레그램 발송 완료!")
          EOF
