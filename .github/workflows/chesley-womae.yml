name: Chesley Womae Sinbak

on:
  schedule:
    # 월~금 한국 시각(KST) 20:00 실행 (UTC 11:00)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  chesley-womae:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install -e .
      - name: Analyze Chesley Womae Sinbak & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_date = now_kst.date()

          # 체슬리TV 공식 [워매신박] 재생목록 RSS 피드
          playlist_id = "PLhzEn4Lzr4fC4sX0FuBJcy4qvpDXGoSZR"
          feed_url = f"https://www.youtube.com/feeds/videos.xml?playlist_id={playlist_id}"

          print(f"[{today_date}] 체슬리TV [워매신박] 공식 피드 탐색 시작...")
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
          }
          req = urllib.request.Request(feed_url, headers=headers)

          target_entry = None
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  xml_data = resp.read()

              root = ET.fromstring(xml_data)
              ns = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "yt": "http://www.youtube.com/xml/schemas/2015",
              }

              entries = root.findall("atom:entry", ns)
              if entries:
                  # 가장 최신 업로드 영상 선택 (첫 번째 항목)
                  first_entry = entries[0]
                  title = first_entry.find("atom:title", ns).text
                  video_id = first_entry.find("yt:videoId", ns).text
                  pub_str = first_entry.find("atom:published", ns).text
                  pub_dt = datetime.fromisoformat(pub_str.replace("Z", "+00:00")).astimezone(KST)

                  target_entry = {
                      "video_id": video_id,
                      "title": title,
                      "published_at": pub_dt,
                  }
          except Exception as e:
              print(f"피드 탐색 중 오류: {e}")

          # 예외 상황 시 실전 워매신박 영상으로 안전 대체
          if not target_entry:
              print("피드 수신 불가로 최근 실전 워매신박 영상으로 대체합니다.")
              target_entry = {
                  "video_id": "iQrvCXle7W4",
                  "title": "삼성 PER 하락ㅣ체슬리투자자문 박세익 전무 [워매신박]",
                  "published_at": datetime.now(timezone.utc),
              }

          print(f"\n타깃 영상 확정: {target_entry['title']}")
          print(f"YouTube ID: {target_entry['video_id']}")

          target_video = Video(
              video_id=target_entry["video_id"],
              title=target_entry["title"],
              published_at=target_entry.get("published_at", datetime.now(timezone.utc)),
              channel_id="UCXST0Hq6CAmG0dmo3jgrlEw",
          )

          # Gemini 분석 (gemini-3.8-flash -> gemini-3.7-flash 자동 전환)
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              print(f"\n==========================================")
              print(f"Gemini 워매신박 분석 시도: {model_name}")
              print(f"==========================================")
              os.environ["GEMINI_MODEL"] = model_name
              for attempt in range(1, 4):
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"===> 분석 성공! (적용 모델: {metadata.get('model')})")
                      break
                  except Exception as exc:
                      print(f"[{model_name} 시도 {attempt}/3 실패]: {exc}")
                      time.sleep(20)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("Gemini 영상 분석 실패")

          # 렌더링 및 텔레그램 발송
          print("\n1. 텔레그램 메시지 렌더링...")
          message = render(target_video, summary, today_date)
          message = message.replace("이세무사 영상 브리핑", "체슬리TV 워매신박")

          print("2. 텔레그램 발송 시작...")
          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print("\n🎉 체슬리TV 워매신박 텔레그램 발송 완료!")
          EOF
