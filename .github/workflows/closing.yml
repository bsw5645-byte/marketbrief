name: BONG Market Close

on:
  schedule:
    - cron: '40 6 * * 1-5'  # KST 15:40
    - cron: '10 7 * * 1-5'  # KST 16:10: data/delivery retry
    - cron: '40 7 * * 1-5'  # KST 16:40: retry / delayed close
  workflow_dispatch:
    inputs:
      send:
        description: 'Telegram 본문 + Kakao 안내 발송 (기본: 미리보기만)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: bong-market-close-${{ github.ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-closing.txt
      - run: pip install -r requirements-closing.txt
      - name: Restore snapshots and delivery receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/restore_closing_state.py
      - name: Collect, compare and deliver
        env:
          PYTHONPATH: src
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          SEND: ${{ github.event_name == 'schedule' || inputs.send == true }}
        run: |
          if [ "$SEND" = 'true' ]; then
            python -m marketbrief.closing --send
          else
            python -m marketbrief.closing
          fi
      - name: Persist state even when one channel fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bong-closing-state
          path: data/closing/
          retention-days: 90
          if-no-files-found: ignore
      - name: Save reviewable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bong-closing-report
          path: reports/closing/
          retention-days: 30
          if-no-files-found: ignore
