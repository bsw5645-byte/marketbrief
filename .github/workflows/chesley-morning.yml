name: Chesley Morning Brief

on:
  schedule:
    # 월~금 한국 시각(KST) 11:00 실행 (UTC 02:00)
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

concurrency:
  group: chesley-morning
  cancel-in-progress: true

jobs:
  chesley-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install yt-dlp
          pip install -e .
      - name: Analyze Chesley Morning Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from marketbrief.video.pipeline import deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_date = now_kst.date()
          today_yymmdd = now_kst.strftime("%y.%m.%d")
          today_mmdd = now_kst.strftime("%m.%d")

          print(f"[{today_date}] 체슬리TV 모닝브리프 탐색 시작...")

          cmd = [
              "yt-dlp",
              "--flat-playlist",
              "--dump-json",
              "--playlist-items", "1-6",
              "https://www.youtube.com/@chesleytv/streams"
          ]

          target_entry = None
          fallback_entry = None
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
              for line in proc.stdout.strip().splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  title = item.get("title", "")
                  vid = item.get("id")

                  is_morning = any(kw in title for kw in ["모닝브리프", "운용회의", "모닝"])
                  is_today = (today_yymmdd in title) or (today_mmdd in title)

                  print(f"후보 검토: [{title}] (ID: {vid}) -> 당일 매칭: {is_today}")

                  if is_morning and fallback_entry is None:
                      fallback_entry = {"video_id": vid, "title": title}

                  if is_morning and is_today:
                      target_entry = {"video_id": vid, "title": title}
                      break
          except Exception as e:
              print(f"yt-dlp 탐색 중 에러: {e}")

          if not target_entry and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and fallback_entry:
              target_entry = fallback_entry

          if not target_entry:
              print(f"\n[안내] 오늘({today_date})자 체슬리TV 모닝브리프 영상을 찾지 못했습니다. 종료합니다.")
              sys.exit(0)

          vid = target_entry["video_id"]
          title = target_entry["title"]
          youtube_url = f"https://www.youtube.com/watch?v={vid}"
          print(f"\n타깃 영상 확정: {title} (ID: {vid})")

          gemini_key = os.environ.get("GEMINI_API_KEY")
          # 현역 모델만 사용 + 호환용 gemini-2.5-pro 폴백
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash"]

          prompt = (
              f"오늘 체슬리TV 모닝브리프({title}) 운용회의 방송입니다.\n"
              "방송에서 다룬 글로벌 및 국내 핵심 시황, 매크로 지표 분석, 주요 섹터 및 종목 뷰, "
              "박세익 전무와 펀드매니저들의 핵심 코멘트와 투자 전략을 빠짐없이 가독성 높게 요약해 주세요.\n"
              "마크다운 기호(*, #, ** 등)를 절대 쓰지 말고, 깔끔한 글머리 기호(•, -, 1. 등)와 문단 줄바꿈만 사용하여 텍스트 기반으로 작성하세요."
          )

          # 1시간 이상 영상을 통째로 넣으면 분당 토큰 한도(429)와 서버 메모리(503)가 터지므로,
          # 핵심 운용회의 구간(초반 30분 / 필요시 20분) + 저프레임(fps: 0.2) 설정으로 토큰을 1/8로 경량화
          clip_configs = [
              {"label": "핵심 35분 구간 (3~38분, 저용량 모드)", "start": "180s", "end": "2280s", "fps": 0.2},
              {"label": "초경량 20분 구간 (5~25분, 최소 토큰 모드)", "start": "300s", "end": "1500s", "fps": 0.2},
          ]

          summary = None

          for clip in clip_configs:
              print(f"\n--- 분석 범위 설정: {clip['label']} ---")
              for model_name in candidate_models:
                  print(f"Gemini 분석 요청 중: {model_name}...")
                  api_url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={gemini_key}"

                  payload = json.dumps({
                      "contents": [{
                          "parts": [
                              {
                                  "fileData": {
                                      "fileUri": youtube_url,
                                      "mimeType": "video/*"
                                  },
                                  "videoMetadata": {
                                      "startOffset": clip["start"],
                                      "endOffset": clip["end"],
                                      "fps": clip["fps"]
                                  }
                              },
                              {"text": prompt}
                          ]
                      }],
                      "generationConfig": {
                          "temperature": 0.2,
                          "maxOutputTokens": 4096,
                          "mediaResolution": "MEDIA_RESOLUTION_LOW"
                      }
                  }).encode("utf-8")

                  try:
                      req = urllib.request.Request(api_url, data=payload, headers={"Content-Type": "application/json"})
                      with urllib.request.urlopen(req, timeout=150) as resp:
                          res_data = json.loads(resp.read().decode("utf-8"))
                          candidates = res_data.get("candidates", [])
                          if candidates:
                              parts = candidates[0].get("content", {}).get("parts", [])
                              if parts and parts[0].get("text"):
                                  summary = parts[0]["text"].strip()
                                  print(f"===> 요약 생성 성공! (모델: {model_name}, 구간: {clip['label']})")
                                  break
                  except urllib.error.HTTPError as he:
                      err_body = he.read().decode("utf-8", errors="ignore")
                      print(f"[{model_name} HTTP {he.code} 오류]: {err_body[:180]}")
                      if he.code in (429, 503):
                          print(" -> API 서버 대기열/한도 리셋을 위해 65초 대기합니다...")
                          time.sleep(65)
                      else:
                          time.sleep(15)
                  except Exception as e:
                      print(f"[{model_name} 오류]: {e}")
                      time.sleep(20)

              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("Gemini 요약 생성에 최종 실패했습니다.")

          print("\n텔레그램 발송 시작...")
          message = (
              f"📺 [체슬리TV 모닝브리프] ({today_date})\n"
              f"제목: {title}\n"
              f"링크: {youtube_url}\n\n"
              f"{summary}"
          )

          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print("\n🎉 오늘자 체슬리TV 모닝브리프 텔레그램 발송 완료!")
          EOF
