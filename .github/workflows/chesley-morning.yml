name: Chesley Morning Brief

on:
  schedule:
    # 월~금 한국 시각(KST) 11:00 실행 (UTC 02:00)
    # 만약 10시 30분에 실행하고 싶으시면 '30 1 * * 1-5'로 바꾸시면 됩니다.
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

concurrency:
  group: chesley-morning
  cancel-in-progress: true

jobs:
  chesley-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install yt-dlp
          pip install -e .
      - name: Analyze Chesley Morning Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import json
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone, timedelta
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_date = now_kst.date()
          today_yymmdd = now_kst.strftime("%y.%m.%d")
          today_mmdd = now_kst.strftime("%m.%d")

          print(f"[{today_date}] 1. 체슬리TV 오늘자({today_yymmdd}) 유튜브 링크 가져오는 중...")

          cmd = [
              "yt-dlp",
              "--flat-playlist",
              "--dump-json",
              "--playlist-items", "1-5",
              "https://www.youtube.com/@chesleytv/streams"
          ]

          target_entry = None
          fallback_entry = None
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
              for line in proc.stdout.strip().splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  title = item.get("title", "")
                  vid = item.get("id")

                  is_morning = any(kw in title for kw in ["모닝브리프", "운용회의", "모닝"])
                  is_today = (today_yymmdd in title) or (today_mmdd in title)

                  print(f" - 확인: [{title}] (ID: {vid}) -> 오늘 영상 여부: {is_today}")

                  if is_morning and fallback_entry is None:
                      fallback_entry = {"video_id": vid, "title": title}

                  if is_morning and is_today:
                      target_entry = {"video_id": vid, "title": title}
                      break
          except Exception as e:
              print(f"유튜브 목록 조회 중 에러: {e}")

          # 수동 실행 시 당일 영상이 없으면 최신 모닝브리프 선택
          if not target_entry and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and fallback_entry:
              target_entry = fallback_entry

          if not target_entry:
              print(f"\n[안내] 오늘({today_date})자 체슬리TV 모닝브리프 링크를 찾지 못했습니다. 종료합니다.")
              sys.exit(0)

          print(f"\n확정된 영상: {target_entry['title']}")
          print(f"유튜브 링크: https://www.youtube.com/watch?v={target_entry['video_id']}")

          target_video = Video(
              video_id=target_entry["video_id"],
              title=target_entry["title"],
              published_at=datetime.now(timezone.utc),
              channel_id="UCXST0Hq6CAmG0dmo3jgrlEw",
          )

          # 2. 유튜브 링크를 제미나이에 그대로 넘겨서 요약 (기존 검증된 analyze_video 사용)
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              os.environ["GEMINI_MODEL"] = model_name
              for attempt in range(1, 4):
                  print(f"\n2. 제미나이 영상 요약 진행 중... (모델: {model_name}, 시도: {attempt}/3)")
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"===> 제미나이 요약 성공! (모델: {metadata.get('model')})")
                      break
                  except Exception as exc:
                      print(f" -> 일시 지연({exc}). 65초 대기 후 다시 시도합니다...")
                      time.sleep(65)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("제미나이 영상 요약에 최종 실패했습니다.")

          # 3. 요약된 내용을 텔레그램으로 전송
          print("\n3. 텔레그램 메시지 변환 및 발송 중...")
          message = render(target_video, summary, today_date)
          message = message.replace("이세무사 영상 브리핑", "체슬리TV 모닝브리프")

          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print("\n🎉 체슬리TV 모닝브리프 텔레그램 발송 완료!")
          EOF
