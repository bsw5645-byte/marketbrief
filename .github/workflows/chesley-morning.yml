name: Chesley Morning Brief

on:
  schedule:
    # 월~금 한국 시각(KST) 10:00 실행 (UTC 01:00)
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  chesley-morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install -e .
      - name: Analyze Chesley Morning Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from marketbrief.video.gemini import analyze_video
          from marketbrief.video.pipeline import Video, render, deliver_telegram

          # 1. KST 날짜 설정
          KST = timezone(timedelta(hours=9))
          today_date = datetime.now(KST).date()

          print(f"[{today_date}] 체슬리TV 라이브 스트림 탐색 시작...")
          streams_url = "https://www.youtube.com/@chesleytv/streams"
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "ko-KR,ko;q=0.9,en-US;q=0.8",
          }
          req = urllib.request.Request(streams_url, headers=headers)
          
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  html = resp.read().decode("utf-8", errors="replace")
          except Exception as e:
              print(f"체슬리TV 페이지 접속 실패: {e}")
              sys.exit(0)

          # 2. 페이지 내부 데이터에서 모닝브리프 영상 추출
          target_entry = None
          
          # ytInitialData JSON 블록 탐색
          match = re.search(r"var ytInitialData\s*=\s*({.+?});</script>", html)
          if match:
              try:
                  data = json.loads(match.group(1))
                  # JSON 텍스트 전체에서 비디오 렌더러 정보 매칭
                  raw_str = match.group(1)
                  video_matches = re.findall(r'"videoId":"([a-zA-Z0-9_-]{11})".*?"title":\{"runs":\[\{"text":"([^"]+)"\}\]', raw_str)
                  for vid, title in video_matches:
                      if any(kw in title for kw in ["모닝브리프", "운용회의", "모닝 브리프"]):
                          target_entry = {"video_id": vid, "title": title}
                          break
              except Exception:
                  pass

          # 정규식 대체 탐색 (JSON 파싱 실패 대비)
          if not target_entry:
              video_pattern = re.findall(r'href="/watch\?v=([a-zA-Z0-9_-]{11})"[^>]*title="([^"]+)"', html)
              for vid, title in video_pattern:
                  if any(kw in title for kw in ["모닝브리프", "운용회의", "모닝"]):
                      target_entry = {"video_id": vid, "title": title}
                      break

          if not target_entry:
              print("최신 모닝브리프 라이브 영상을 탐색하지 못했습니다. (종료 대기)")
              sys.exit(0)

          print(f"타깃 영상 확인: {target_entry['title']} ({target_entry['video_id']})")
          
          target_video = Video(
              video_id=target_entry["video_id"],
              title=target_entry["title"],
              published_at=datetime.now(timezone.utc),
              channel_id="UCXST0Hq6CAmG0dmo3jgrlEw",
          )

          # 3. Gemini 분석 (백오프 및 모델 자동 전환)
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash"]
          summary = None
          metadata = None

          for model_name in candidate_models:
              print(f"\nGemini 분석 시도 ({model_name})...")
              os.environ["GEMINI_MODEL"] = model_name
              for attempt in range(1, 4):
                  try:
                      summary, metadata = analyze_video(target_video)
                      print(f"분석 완료! (적용 모델: {metadata.get('model')})")
                      break
                  except Exception as exc:
                      print(f"시도 {attempt}/3 실패: {exc}")
                      time.sleep(20)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("모든 모델에서 영상 분석에 실패했습니다.")

          # 4. 렌더링 및 텔레그램 발송
          print("\n텔레그램 메시지 렌더링...")
          message = render(target_video, summary, today_date)

          print("텔레그램 발송 시작...")
          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print("🎉 체슬리TV 모닝브리프 발송 완료!")
          EOF
