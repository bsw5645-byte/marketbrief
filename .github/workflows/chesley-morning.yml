name: Chesley Morning Brief

on:
  schedule:
    # 월~금 한국 시각(KST) 11:00 실행 (UTC 02:00)
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

concurrency:
  group: chesley-morning
  cancel-in-progress: true

jobs:
  chesley-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements-closing.txt -r requirements-youtube.txt
          pip install yt-dlp youtube-transcript-api
          pip install -e .
      - name: Analyze Chesley Morning Brief & Send Telegram
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - << 'EOF'
          import glob
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from youtube_transcript_api import YouTubeTranscriptApi
          from marketbrief.video.pipeline import deliver_telegram

          KST = timezone(timedelta(hours=9))
          now_kst = datetime.now(KST)
          today_date = now_kst.date()
          today_yymmdd = now_kst.strftime("%y.%m.%d")
          today_mmdd = now_kst.strftime("%m.%d")

          print(f"[{today_date}] 체슬리TV 모닝브리프 탐색 시작...")

          cmd = [
              "yt-dlp",
              "--flat-playlist",
              "--dump-json",
              "--playlist-items", "1-6",
              "https://www.youtube.com/@chesleytv/streams"
          ]

          target_entry = None
          fallback_entry = None
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
              for line in proc.stdout.strip().splitlines():
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  title = item.get("title", "")
                  vid = item.get("id")

                  is_morning = any(kw in title for kw in ["모닝브리프", "운용회의", "모닝"])
                  is_today = (today_yymmdd in title) or (today_mmdd in title)

                  print(f"후보 검토: [{title}] (ID: {vid}) -> 당일 매칭: {is_today}")

                  if is_morning and fallback_entry is None:
                      fallback_entry = {"video_id": vid, "title": title}

                  if is_morning and is_today:
                      target_entry = {"video_id": vid, "title": title}
                      break
          except Exception as e:
              print(f"yt-dlp 탐색 중 에러: {e}")

          if not target_entry and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and fallback_entry:
              target_entry = fallback_entry

          if not target_entry:
              print(f"\n[안내] 오늘({today_date})자 체슬리TV 모닝브리프 영상을 찾지 못했습니다. 종료합니다.")
              sys.exit(0)

          vid = target_entry["video_id"]
          title = target_entry["title"]
          print(f"\n타깃 영상 확정: {title} (ID: {vid})")

          # 1. 자막(대본) 추출 시도 (youtube-transcript-api 1순위 -> yt-dlp 2순위)
          transcript_text = ""
          print("\n1. 방송 대본(스크립트) 추출 중...")
          try:
              ytt = YouTubeTranscriptApi()
              try:
                  fetched = ytt.fetch(vid, languages=['ko'])
                  transcript_text = " ".join([snippet.text for snippet in fetched])
              except AttributeError:
                  t_list = YouTubeTranscriptApi.get_transcript(vid, languages=['ko'])
                  transcript_text = " ".join([x['text'] for x in t_list])
              print(f"===> 전용 API 대본 추출 성공! (글자 수: {len(transcript_text)}자)")
          except Exception as e:
              print(f" -> 전용 API 자막 미생성 또는 제한 ({e}), yt-dlp 자막 추출 시도...")
              try:
                  sub_cmd = [
                      "yt-dlp", "--skip-download", "--write-auto-sub", "--write-sub",
                      "--sub-lang", "ko", "--sub-format", "vtt", "-o", f"sub_{vid}",
                      f"https://www.youtube.com/watch?v={vid}"
                  ]
                  subprocess.run(sub_cmd, capture_output=True, text=True, timeout=45)
                  vtt_files = glob.glob(f"sub_{vid}*.vtt")
                  if vtt_files:
                      with open(vtt_files[0], "r", encoding="utf-8") as f:
                          raw_vtt = f.read()
                      lines = []
                      for line in raw_vtt.splitlines():
                          line = line.strip()
                          if not line or line.startswith("WEBVTT") or "-->" in line or line.startswith("Kind:") or line.startswith("Language:"):
                              continue
                          clean = re.sub(r"<[^>]+>", "", line)
                          if clean and (not lines or lines[-1] != clean):
                              lines.append(clean)
                      transcript_text = " ".join(lines)
                      print(f"===> yt-dlp 대본 추출 성공! (글자 수: {len(transcript_text)}자)")
              except Exception as e2:
                  print(f" -> yt-dlp 자막 참고: {e2}")

          # 2. Gemini 요약 호출 (무거운 원본 비디오 직접 호출을 배제하여 500/429 원천 차단)
          gemini_key = os.environ.get("GEMINI_API_KEY")
          candidate_models = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-2.0-flash"]
          summary = None

          if len(transcript_text) >= 300:
              # 대본이 있을 때: 가벼운 텍스트 프롬프트로 5초 만에 요약 완료
              prompt = (
                  f"다음은 오늘 체슬리TV 모닝브리프({title}) 방송의 전체 스크립트입니다.\n"
                  "핵심 시황, 글로벌 매크로 분석, 주요 섹터 및 종목 뷰, 투자 전략, 박세익 전무와 펀드매니저들의 핵심 코멘트를 "
                  "가독성 높게 구조화하여 요약해 주세요. 마크다운 기호(*, # 등) 대신 깔끔한 글머리 기호(•, -, 1. 등)와 문단 구분을 사용하세요.\n\n"
                  f"[방송 스크립트]\n{transcript_text[:45000]}"
              )
              contents_payload = [{"parts": [{"text": prompt}]}]
          else:
              # 라이브 직후라 대본이 아직 없을 때: 미디어 해상도를 LOW로 낮춰 토큰 소모를 1/5로 줄여서 호출
              print(" -> 아직 유튜브 자동 자막이 생성되지 않아 저용량 미디어 모드로 분석합니다.")
              prompt = (
                  f"오늘 체슬리TV 모닝브리프({title}) 영상입니다.\n"
                  "핵심 시황, 글로벌 매크로 분석, 주요 섹터 및 종목 뷰, 투자 전략, 박세익 전무와 펀드매니저들의 핵심 코멘트를 "
                  "가독성 높게 구조화하여 요약해 주세요. 마크다운 기호(*, # 등) 대신 깔끔한 글머리 기호(•, -, 1. 등)와 문단 구분을 사용하세요."
              )
              contents_payload = [{
                  "parts": [
                      {"fileData": {"fileUri": f"https://www.youtube.com/watch?v={vid}", "mimeType": "video/*"}},
                      {"text": prompt}
                  ]
              }]

          for model_name in candidate_models:
              for attempt in range(1, 3):
                  print(f"\nGemini 요약 요청 중: {model_name} (시도 {attempt}/2)...")
                  api_url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={gemini_key}"
                  gen_config = {"temperature": 0.2, "maxOutputTokens": 4096}
                  if len(transcript_text) < 300:
                      gen_config["mediaResolution"] = "MEDIA_RESOLUTION_LOW"

                  payload = json.dumps({
                      "contents": contents_payload,
                      "generationConfig": gen_config
                  }).encode("utf-8")

                  try:
                      req = urllib.request.Request(api_url, data=payload, headers={"Content-Type": "application/json"})
                      with urllib.request.urlopen(req, timeout=120) as resp:
                          res_data = json.loads(resp.read().decode("utf-8"))
                          text_out = res_data.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "").strip()
                          if text_out:
                              print(f"===> 요약 생성 성공! ({model_name})")
                              summary = text_out
                              break
                  except urllib.error.HTTPError as he:
                      err_body = he.read().decode("utf-8", errors="ignore")
                      print(f"[{model_name} HTTP {he.code} 오류]: {err_body[:200]}")
                      if he.code == 429:
                          print(" -> 분당 한도(429) 쿨다운을 위해 65초 대기합니다...")
                          time.sleep(65)
                      elif he.code == 404:
                          break
                      else:
                          time.sleep(20)
                  except Exception as e:
                      print(f"[{model_name} 실패]: {e}")
                      time.sleep(20)
              if summary is not None:
                  break

          if summary is None:
              raise RuntimeError("Gemini 요약 생성에 최종 실패했습니다.")

          print("\n2. 텔레그램 발송 시작...")
          message = (
              f"📺 [체슬리TV 모닝브리프] ({today_date})\n"
              f"제목: {title}\n"
              f"링크: https://www.youtube.com/watch?v={vid}\n\n"
              f"{summary}"
          )

          try:
              deliver_telegram(message, receipt={}, save=lambda _: None)
          except TypeError:
              deliver_telegram(message, {}, lambda _: None)

          print("\n🎉 오늘자 체슬리TV 모닝브리프 텔레그램 발송 완료!")
          EOF
