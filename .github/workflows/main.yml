name: BONG Morning Brief

on:
  schedule:
    # 한국시간 월~금 오전 8시
    - cron: '0 23 * * 0-4'

  workflow_dispatch:

jobs:
  morning-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install yfinance requests feedparser

      - name: Create and send morning brief
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          cat << 'PY' > /tmp/brief.py

          import os
          import time
          import requests
          import feedparser
          import yfinance as yf

          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import quote


          # =====================================
          # 시장 데이터
          # =====================================

          assets = {
              "NASDAQ": "^IXIC",
              "S&P500": "^GSPC",
              "필라델피아 반도체": "^SOX",
              "NVIDIA": "NVDA",
              "Micron": "MU",
              "USD/KRW": "KRW=X",
              "JPY/KRW": "JPYKRW=X",
          }


          def get_change(ticker):
              df = yf.Ticker(ticker).history(period="5d")
              closes = df["Close"].dropna()

              if len(closes) < 2:
                  return None, None

              previous = float(closes.iloc[-2])
              current = float(closes.iloc[-1])
              change = (current / previous - 1) * 100

              return current, change


          data = {}

          for name, ticker in assets.items():
              try:
                  data[name] = get_change(ticker)
              except Exception:
                  data[name] = (None, None)


          def market_line(name):

              value, change = data[name]

              if value is None:
                  return f"{name}: 데이터 확인 실패"

              arrow = "▲" if change >= 0 else "▼"

              if name in ["USD/KRW", "JPY/KRW"]:
                  return (
                      f"{name}: {value:,.2f}원 "
                      f"{arrow}{abs(change):.2f}%"
                  )

              return f"{name}: {change:+.2f}%"


          # =====================================
          # 한국어 뉴스
          # =====================================

          queries = [
              "엔비디아 AI 반도체 when:1d",
              "마이크론 메모리 반도체 when:1d",
              "미국 증시 나스닥 반도체 when:1d",
              "AI 빅테크 미국 증시 when:1d",
              "한국 증시 반도체 when:1d",
          ]

          all_news = []
          seen = set()

          for query in queries:

              url = (
                  "https://news.google.com/rss/search?"
                  f"q={quote(query)}"
                  "&hl=ko"
                  "&gl=KR"
                  "&ceid=KR:ko"
              )

              try:
                  feed = feedparser.parse(url)

                  for entry in feed.entries[:10]:

                      title = entry.title.strip()

                      # 한국어 제목만 사용
                      if not any(
                          '\uac00' <= c <= '\ud7a3'
                          for c in title
                      ):
                          continue

                      if title in seen:
                          continue

                      seen.add(title)

                      timestamp = 0

                      if hasattr(entry, "published_parsed"):
                          try:
                              timestamp = time.mktime(
                                  entry.published_parsed
                              )
                          except Exception:
                              pass

                      all_news.append({
                          "title": title,
                          "time": timestamp
                      })

              except Exception:
                  pass


          all_news.sort(
              key=lambda x: x["time"],
              reverse=True
          )

          selected_news = all_news[:5]


          if selected_news:

              news_text = "\n\n".join(
                  f"{i+1}. {item['title']}"
                  for i, item in enumerate(selected_news)
              )

          else:
              news_text = "관련 뉴스를 가져오지 못했습니다."


          # =====================================
          # 날짜
          # =====================================

          now = datetime.now(
              ZoneInfo("Asia/Seoul")
          )

          weekdays = [
              "월요일",
              "화요일",
              "수요일",
              "목요일",
              "금요일",
              "토요일",
              "일요일"
          ]

          today = (
              f"{now.year}년 "
              f"{now.month:02d}월 "
              f"{now.day:02d}일 "
              f"{weekdays[now.weekday()]}"
          )


          # =====================================
          # 메시지
          # =====================================

          message = f"""☀️ BONG Morning Brief
          {today}

          📊 밤사이 시장
          {market_line("NASDAQ")}
          {market_line("S&P500")}
          {market_line("필라델피아 반도체")}

          💵 환율
          {market_line("USD/KRW")}
          {market_line("JPY/KRW")}

          💼 미국 반도체
          NVIDIA: {market_line("NVIDIA").split(": ",1)[1]}
          Micron: {market_line("Micron").split(": ",1)[1]}

          📰 관심 뉴스 TOP 5
          {news_text}

          ─────────────
          BONG Morning Brief
          """


          message = "\n".join(
              line.strip()
              for line in message.splitlines()
          )


          # =====================================
          # Telegram 전송
          # =====================================

          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              data={
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message
              },
              timeout=30
          )

          response.raise_for_status()

          PY

          python /tmp/brief.py
