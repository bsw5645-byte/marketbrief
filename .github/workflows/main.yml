          # =====================================
          # S&P Global 미국 PMI 일정 추가
          # =====================================

          import re
          from bs4 import BeautifulSoup

          def read_sp_global_pmi():

              try:

                  url = (
                      "https://pmi.spglobal.com/Public/Release/"
                      "ReleaseDates?language=en&os=0"
                  )

                  response = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=20
                  )

                  response.raise_for_status()

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

                  lines = [
                      re.sub(r"\s+", " ", line).strip()
                      for line
                      in soup.get_text("\n").splitlines()
                      if line.strip()
                  ]

                  months = {
                      "January": 1,
                      "February": 2,
                      "March": 3,
                      "April": 4,
                      "May": 5,
                      "June": 6,
                      "July": 7,
                      "August": 8,
                      "September": 9,
                      "October": 10,
                      "November": 11,
                      "December": 12,
                  }

                  current_year = now.year
                  current_month = None
                  current_day = None

                  for line in lines:

                      # 연도
                      if re.fullmatch(
                          r"20\d{2}",
                          line
                      ):

                          current_year = int(line)
                          continue


                      # 날짜
                      date_match = re.fullmatch(
                          r"(January|February|March|April|May|June|"
                          r"July|August|September|October|November|December)"
                          r"\s+(\d{1,2})",
                          line
                      )

                      if date_match:

                          current_month = months[
                              date_match.group(1)
                          ]

                          current_day = int(
                              date_match.group(2)
                          )

                          continue


                      # 발표시간 + 지표명
                      event_match = re.match(
                          r"(\d{2}:\d{2})\s*UTC\s+(.+)",
                          line
                      )

                      if not (
                          event_match
                          and current_month
                          and current_day
                      ):
                          continue


                      event_name = (
                          event_match.group(2)
                          .strip()
                      )


                      # 미국 PMI만 사용
                      if (
                          "S&P Global" not in event_name
                          or "US" not in event_name
                          or "PMI" not in event_name
                      ):
                          continue


                      hour, minute = map(
                          int,
                          event_match
                          .group(1)
                          .split(":")
                      )


                      dt_utc = datetime(
                          current_year,
                          current_month,
                          current_day,
                          hour,
                          minute,
                          tzinfo=ZoneInfo("UTC")
                      )


                      dt_kst = (
                          dt_utc.astimezone(KST)
                      )


                      # 오늘부터 7일 이내
                      if not (
                          today
                          <= dt_kst.date()
                          <= today
                          + timedelta(days=7)
                      ):
                          continue


                      if "Flash US PMI" in event_name:

                          name = (
                              "🔥 미국 S&P Global "
                              "Flash PMI"
                          )

                      elif (
                          "Manufacturing PMI"
                          in event_name
                      ):

                          name = (
                              "🇺🇸 미국 S&P "
                              "제조업 PMI"
                          )

                      elif (
                          "Services PMI"
                          in event_name
                      ):

                          name = (
                              "🇺🇸 미국 S&P "
                              "서비스업 PMI"
                          )

                      else:

                          name = (
                              "🇺🇸 미국 "
                              "S&P Global PMI"
                          )


                      schedule_events.append(
                          {
                              "dt": dt_kst,
                              "name": name
                          }
                      )


              except Exception:
                  pass


          read_sp_global_pmi()
