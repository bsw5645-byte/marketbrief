name: BONG Morning Brief

on:
  workflow_dispatch:

jobs:
  morning-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install yfinance requests feedparser

      - name: Create and send morning brief
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'PY' > /tmp/brief.py
          import os
          import yfinance as yf
          import requests
          import feedparser
          from datetime import datetime
          from zoneinfo import ZoneInfo

          # =========================
          # 시장 데이터
          # =========================
          assets = {
              "NASDAQ": "^IXIC",
              "S&P500": "^GSPC",
              "필라델피아 반도체": "^SOX",
              "NVIDIA": "NVDA",
              "Micron": "MU",
              "USD/KRW": "KRW=X",
              "JPY/KRW": "JPYKRW=X",
          }

          def get_change(ticker):
              df = yf.Ticker(ticker).history(period="5d")
              closes = df["Close"].dropna()

              if len(closes) < 2:
                  return None, None

              previous = float(closes.iloc[-2])
              current = float(closes.iloc[-1])
              change = (current / previous - 1) * 100

              return current, change

          data = {}

          for name, ticker in assets.items():
              try:
                  data[name] = get_change(ticker)
              except Exception:
                  data[name] = (None, None)

          def line(name):
              value, change = data[name]

              if value is None:
                  return f"{name}: 데이터 확인 실패"

              arrow = "▲" if change >= 0 else "▼"

              if name in ["USD/KRW", "JPY/KRW"]:
                  return f"{name}: {value:,.2f}원 {arrow}{abs(change):.2f}%"

              return f"{name}: {change:+.2f}%"

          # =========================
          # 최신 뉴스
          # =========================
          rss_urls = [
              "https://news.google.com/rss/search?q=AI+NVIDIA+semiconductor+stock+market&hl=en-US&gl=US&ceid=US:en",
              "https://news.google.com/rss/search?q=Micron+semiconductor+NASDAQ&hl=en-US&gl=US&ceid=US:en",
          ]

          news = []
          seen = set()

          for url in rss_urls:
              try:
                  feed = feedparser.parse(url)

                  for entry in feed.entries:
                      title = entry.title.strip()

                      if title not in seen:
                          seen.add(title)
                          news.append(title)

                      if len(news) >= 5:
                          break

              except Exception:
                  pass

              if len(news) >= 5:
                  break

          if news:
              news_text = "\n".join(
                  f"{i+1}. {title}"
                  for i, title in enumerate(news[:5])
              )
          else:
              news_text = "뉴스를 가져오지 못했습니다."

          # =========================
          # 메시지 작성
          # =========================
          today = datetime.now(
              ZoneInfo("Asia/Seoul")
          ).strftime("%Y년 %m월 %d일")

          message = f"""☀️ BONG Morning Brief
          {today}

          📊 밤사이 시장
          {line("NASDAQ")}
          {line("S&P500")}
          {line("필라델피아 반도체")}

          💵 환율
          {line("USD/KRW")}
          {line("JPY/KRW")}

          💼 미국 반도체·빅테크
          {line("NVIDIA")}
          {line("Micron")}

          📰 관심 뉴스 TOP 5
          {news_text}

          ─────────────
          BONG Morning Brief
          """

          # 앞쪽 불필요한 공백 제거
          message = "\n".join(
              line.strip() for line in message.splitlines()
          )

          # =========================
          # 텔레그램 전송
          # =========================
          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
              data={
                  "chat_id": os.environ["CHAT_ID"],
                  "text": message
              },
              timeout=30
          )

          response.raise_for_status()

          PY

          python /tmp/brief.py
