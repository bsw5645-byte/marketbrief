name: YouTube summary tests
on:
  pull_request:
    paths:
      - 'src/marketbrief/video/**'
      - 'tests/test_video.py'
      - 'tests/test_gemini.py'
      - 'requirements-youtube.txt'
      - 'scripts/restore_youtube_state.py'
      - '.github/workflows/youtube*.yml'
  push:
    branches: ['feat/youtube-close-summary']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-youtube.txt pytest==9.1.1
      - run: PYTHONPATH=src python -m pytest tests/test_video.py tests/test_gemini.py -q
  gemini-video-probe:
    # One historical preview on this implementation push; no Telegram delivery.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-youtube.txt
      - name: Analyze Oct 7 video through Gemini, preview only
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: python scripts/gemini_video_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bong-gemini-probe
          path: reports/youtube/
          retention-days: 7
