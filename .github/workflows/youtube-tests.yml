name: YouTube summary tests
on:
  pull_request:
    paths:
      - 'src/marketbrief/video/**'
      - 'tests/test_video.py'
      - 'requirements-youtube.txt'
      - 'scripts/restore_youtube_state.py'
      - '.github/workflows/youtube*.yml'
  push:
    branches: ['feat/youtube-close-summary']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-youtube.txt pytest==9.1.1
      - run: PYTHONPATH=src python -m pytest tests/test_video.py -q
  live-caption-probe:
    # GitHub-hosted caption access was blocked on Oct 8. Do not automatically
    # repeat that known blocked request on every implementation push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-youtube.txt
      - name: Oct 7 actual caption test, no GPT charge or delivery
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m marketbrief.video --date 2026-10-07 --video-id YTU7rE9cEnQ --fetch-only
      - name: Oct 7 GPT summary preview, no delivery
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python -m marketbrief.video --date 2026-10-07 --video-id YTU7rE9cEnQ
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bong-youtube-probe
          path: reports/youtube/
          retention-days: 7
